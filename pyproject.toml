[project]
name = "signal-agent"
version = "0.1.0"
description = "Hiring-signal outreach agent: collect, qualify, research, draft grounded outreach, human review."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "anthropic>=0.75",
  "psycopg[binary,pool]>=3.2",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "httpx>=0.27",
  "structlog>=24.4",
  "typer>=0.12",
  "pyyaml>=6.0",
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "selectolax>=0.3",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8", "mypy>=1.13", "hypothesis>=6.115", "types-pyyaml"]

[project.scripts]
signal = "signal_agent.cli:app"

[project.optional-dependencies]
langfuse = [
    "langfuse>=3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/signal_agent"]

[tool.ruff]
line-length = 120
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]  # typer.Option defaults are the documented pattern
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"src/signal_agent/pipeline/stages.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: needs the local Postgres from docker-compose"]
